name: Calidad automatizada SEVB

on:
  push:
    branches:
      - ci/calidad-jacoco-pmd
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Pruebas, cobertura y análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas automatizadas
        run: mvn -B -ntp clean verify

      - name: Generar reportes JaCoCo, PMD y CPD
        if: always()
        run: |
          if [ ! -d target/classes ]; then
            echo "No existen clases compiladas; no es posible generar los reportes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mvn -B -ntp jacoco:report pmd:pmd pmd:cpd

      - name: Resumir métricas disponibles
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = ["## Resultados de calidad SEVB", ""]
          jacoco = Path("target/site/jacoco/jacoco.xml")
          if jacoco.exists():
              root = ET.parse(jacoco).getroot()
              counters = {c.attrib["type"]: c.attrib for c in root.findall("counter")}
              line = counters.get("LINE")
              if line:
                  covered = int(line["covered"])
                  missed = int(line["missed"])
                  total = covered + missed
                  pct = (covered / total * 100) if total else 0
                  lines += [f"- **Cobertura de líneas JaCoCo:** {pct:.2f}% ({covered}/{total})."]
              else:
                  lines += ["- JaCoCo generó el XML, pero no incluyó el contador de líneas global."]
          else:
              lines += ["- **JaCoCo:** no se encontró jacoco.xml; revisar el resultado de pruebas y del agente."]

          pmd = Path("target/pmd.xml")
          if pmd.exists():
              root = ET.parse(pmd).getroot()
              violations = root.findall(".//violation")
              lines += [f"- **Hallazgos PMD:** {len(violations)}."]
              priorities = {}
              for item in violations:
                  p = item.attrib.get("priority", "sin prioridad")
                  priorities[p] = priorities.get(p, 0) + 1
              for p in sorted(priorities):
                  lines += [f"  - Prioridad {p}: {priorities[p]}."]
          else:
              lines += ["- **PMD:** no se encontró pmd.xml; revisar el paso de análisis."]

          cpd = Path("target/cpd.xml")
          if cpd.exists():
              root = ET.parse(cpd).getroot()
              duplications = root.findall(".//duplication")
              lines += [f"- **Duplicaciones CPD:** {len(duplications)}."]
          else:
              lines += ["- **CPD:** no se encontró cpd.xml; revisar el paso de análisis."]

          lines += ["", "Los reportes completos se adjuntan como artefacto de esta ejecución."]
          summary = "\n".join(lines) + "\n"
          Path("quality-summary.md").write_text(summary, encoding="utf-8")
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Publicar evidencias de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad-sevb-${{ github.run_number }}
          path: |
            quality-summary.md
            target/jacoco.exec
            target/site/jacoco/**
            target/reports/**
            target/pmd.xml
            target/cpd.xml
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 30
